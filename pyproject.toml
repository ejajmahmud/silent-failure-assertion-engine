[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "silent-failure-assertion-engine"
version = "0.1.0"
description = "Evaluates agent trajectories for semantic silent failures (no-op edits, skipped tests, wrong scope) beyond exit codes"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
silent-failure-assertion-engine = "silent_failure_assertion_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["silent_failure_assertion_engine*"]
